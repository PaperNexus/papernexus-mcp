name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check-jsonschema
        run: pip install check-jsonschema==0.29.4
      - name: Every JSON file parses
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python -m json.tool > /dev/null
      - name: server.json matches the MCP Registry schema
        run: |
          check-jsonschema --schemafile "$(python -c 'import json; print(json.load(open("server.json"))["$schema"])')" server.json
      - name: Every manifest names the same server URL
        run: |
          url=https://papernex.us/mcp
          python - "$url" <<'PY'
          import json, sys
          url = sys.argv[1]
          found = {
              "server.json": json.load(open("server.json"))["remotes"][0]["url"],
              "plugins/papernexus/.mcp.json": json.load(open("plugins/papernexus/.mcp.json"))["mcpServers"]["papernexus"]["url"],
              "gemini-extension.json": json.load(open("gemini-extension.json"))["mcpServers"]["papernexus"]["httpUrl"],
              "chatgpt/mcp.json": json.load(open("chatgpt/mcp.json"))["mcpServers"]["papernexus"]["url"],
          }
          wrong = {name: value for name, value in found.items() if value != url}
          if wrong:
              sys.exit(f"Server URL differs from {url}: {wrong}")
          versions = {
              "server.json": json.load(open("server.json"))["version"],
              "plugins/papernexus/.claude-plugin/plugin.json": json.load(open("plugins/papernexus/.claude-plugin/plugin.json"))["version"],
              "gemini-extension.json": json.load(open("gemini-extension.json"))["version"],
              "chatgpt/plugin.json": json.load(open("chatgpt/plugin.json"))["version"],
          }
          if len(set(versions.values())) != 1:
              sys.exit(f"Versions differ: {versions}")
          PY
      - name: The plugins' logos are the same file as the repo's
        run: |
          cmp assets/logo.png plugins/papernexus/assets/logo.png
          cmp assets/logo.png chatgpt/assets/logo.png
      # chatgpt/mcp.json is not checked against its $schema: OpenAI reads the
      # per-server extensions.com.openai.auth block, which the published Agent
      # Plugins 1.0.0 schema does not allow.
      - name: The ChatGPT manifest matches the Agent Plugins schema
        run: |
          check-jsonschema --schemafile "$(python -c 'import json; print(json.load(open("chatgpt/plugin.json"))["$schema"])')" chatgpt/plugin.json
      - name: The ChatGPT listing fits the directory's limits
        run: python scripts/check-chatgpt-listing.py
      - name: The ChatGPT ZIP builds
        run: scripts/build-chatgpt-zip.sh
